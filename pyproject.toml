[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskflow"
version = "1.0.0"
description = "Autonomous Execution Clerk for Binance Agent OS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DeskFlow Team" }]

[project.scripts]
deskflow = "deskflow:main"
